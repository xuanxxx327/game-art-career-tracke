name: Game Art Career Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * *'
  push:
    paths:
      - monitor.py
      - sources.json
      - requirements.txt
      - tests/**
permissions:
  contents: write
concurrency:
  group: career-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect internships and campus openings
        run: python monitor.py
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: recruitment-results
          path: data/jobs.json
          retention-days: 30
      - name: Save results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update game art recruitment snapshot"
            for n in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              if [ "$n" -eq 3 ]; then
                echo "Failed to publish recruitment snapshot" >&2
                exit 1
              fi
              sleep 3
            done
          fi
