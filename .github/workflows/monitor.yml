name: Game Art Career Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * *'
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python monitor.py
      - uses: actions/upload-artifact@v4
        with:
          name: recruitment-results
          path: results.json
          retention-days: 30
